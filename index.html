<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aniversário da Romana 👑</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Fredoka:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="estilos/style.css">
</head>

<body>

    <main class="convite">

        <!-- TELA 1 - CAPA -->
        <section class="pagina capa">
            <img 
                src="imagens/capa.png" 
                alt="Convite de aniversário de 2 anos da Romana, tema Branca de Neve Baby"
                class="imagem-convite"
            >
            <div class="deslize">Deslize para continuar →</div>
        </section>

        <!-- TELA 2 - INFORMAÇÕES -->
        <section class="pagina tela-festa">
            <img
                src="imagens/festa.jpeg"
                alt="Informações do aniversário de 2 anos da Romana"
                class="imagem-convite"
            >
            <div class="deslize">Deslize para continuar →</div>
        </section>

        <!-- TELA 3 - LOCALIZAÇÃO -->
        <section class="pagina tela-local">
            <div class="container-imagem">
                <img
                    src="imagens/local.png"
                    alt="Local da festa de aniversário da Romana"
                    class="imagem-convite"
                >
                <button
                    class="botao-mapa"
                    onclick="abrirMapa()"
                    aria-label="Como chegar à Fazenda Romana">
                </button>
            </div>
            <div class="deslize">Deslize para continuar →</div>
        </section>

        <!-- TELA 4 - CONTAGEM REGRESSIVA -->
        <section class="pagina tela-contagem">
            <div class="container-imagem">
                <img
                    src="imagens/contagem.png"
                    alt="Contagem regressiva para o aniversário da Romana"
                    class="imagem-convite"
                >
                <div class="contador-sobreposto">
                    <div class="tempo">
                        <strong id="dias">00</strong>
                        <span>DIAS</span>
                    </div>
                    <div class="tempo">
                        <strong id="horas">00</strong>
                        <span>HORAS</span>
                    </div>
                    <div class="tempo">
                        <strong id="minutos">00</strong>
                        <span>MINUTOS</span>
                    </div>
                    <div class="tempo">
                        <strong id="segundos">00</strong>
                        <span>SEGUNDOS</span>
                    </div>
                </div>
            </div>
            <div class="deslize">Deslize para continuar →</div>
        </section>

        <!-- TELA 5 - MENSAGEM ESPECIAL -->
        <section class="pagina tela-mensagem">
            <img
                src="imagens/mensagem.png"
                alt="Mensagem especial dos pais"
                class="imagem-convite"
            >
            <div class="deslize">Deslize para continuar →</div>
        </section>

        <!-- TELA 6 - FINAL -->
        <section class="pagina tela-final">
            <div class="container-imagem">
                <img
                    src="imagens/final.png"
                    alt="Mensagem final do convite de aniversário da Romana"
                    class="imagem-convite"
                >
                <button
                    class="botao-inicio"
                    onclick="voltarInicio()"
                    aria-label="Voltar ao início do convite">
                </button>
            </div>
        </section>

    </main>

    <script src="scripts/script.js"></script>
</body>

</html>
