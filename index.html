<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aniversário da Romana 👑</title>

    <!-- Importando as fontes infantis -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Fredoka:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">

    <!-- Arquivo CSS -->
    <link rel="stylesheet" href="estilos/style.css">
</head>

<body>

    <!-- Música -->
    <audio id="musica" loop>
        <source src="musica/musica.mp4" type="audio/mpeg">
    </audio>

    <!-- Botão da música -->
    <button id="botao-musica" onclick="controlarMusica()">
        🎵
    </button>

    <!-- CONVITE -->
    <main class="convite">

        <!-- TELA 1 - CAPA -->
        <section class="pagina capa">
            <img 
                src="imagens/capa.png" 
                alt="Convite de aniversário de 2 anos da Romana, tema Branca de Neve Baby"
                class="imagem-capa"
            >
            
        </section>

        <!-- TELA 2 - INFORMAÇÕES -->
        <section class="pagina tela-festa">
            <img
                src="imagens/festa.png"
                alt="Informações do aniversário de 2 anos da Romana"
                class="imagem-tela"
            >
            <div class="deslize">Deslize para continuar →</div>
        </section>

        <!-- TELA 3 - LOCALIZAÇÃO -->
        <section class="pagina tela-local">
            <img
                src="imagens/local.png"
                alt="Local da festa de aniversário da Romana"
                class="imagem-tela"
            >

            <!-- Área clicável sobre o botão COMO CHEGAR -->
            <button
                class="botao-mapa"
                onclick="abrirMapa()"
                aria-label="Como chegar à Fazenda Romana">
            </button>
            <div class="deslize">Deslize para continuar →</div>
        </section>

        <!-- TELA 4 - CONTAGEM REGRESSIVA -->
        <section class="pagina tela-contagem">
            <img
                src="imagens/contagem.png"
                alt="Contagem regressiva para o aniversário da Romana"
                class="imagem-contagem"
            >

            <div class="contador-sobreposto">
                <div class="tempo">
                    <strong id="dias">00</strong>
                    <span>DIAS</span>
                </div>
                <div class="tempo">
                    <strong id="horas">00</strong>
                    <span>HORAS</span>
                </div>
                <div class="tempo">
                    <strong id="minutos">00</strong>
                    <span>MINUTOS</span>
                </div>
                <div class="tempo">
                    <strong id="segundos">00</strong>
                    <span>SEGUNDOS</span>
                </div>
            </div>
            <div class="deslize">Deslize para continuar →</div>
        </section>

        <!-- TELA 5 - MENSAGEM ESPECIAL -->
        <section class="pagina tela-mensagem">
            <img
                src="imagens/mensagem.png"
                alt="Mensagem especial de Rosiene e Regilvan para os convidados do aniversário da Romana"
                class="imagem-tela"
            >
            <div class="deslize">Deslize para continuar →</div>
        </section>

        <!-- TELA 6 - FINAL -->
        <section class="pagina tela-final">
            <img
                src="imagens/final.png"
                alt="Mensagem final do convite de aniversário da Romana"
                class="imagem-final"
            >

            <!-- Área clicável sobre "Voltar ao início" -->
            <button
                class="botao-inicio"
                onclick="voltarInicio()"
                aria-label="Voltar ao início do convite">
            </button>
            
        </section>

    </main>

    <!-- Chamada do arquivo JS -->
    <script src="scripts/script.js"></script>
</body>

</html>
