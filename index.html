<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aniversário da Romana 👑</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Fredoka:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="estilos/style.css">
</head>

<body>

    <main class="convite">

        <!-- TELA 1 - CAPA -->
        <section class="pagina capa">
            <div class="card-imagem">
                <img src="imagens/capa.png" alt="Capa Convite Romana" class="imagem-tela">
                <div class="deslize">Deslize para baixo ↓</div>
            </div>
        </section>

        <!-- TELA 2 - INFORMAÇÕES -->
        <section class="pagina tela-festa">
            <div class="card-imagem">
                <img src="imagens/festa.png" alt="Informações da Festa" class="imagem-tela">
                <div class="deslize">Deslize para baixo ↓</div>
            </div>
        </section>

        <!-- TELA 3 - LOCALIZAÇÃO -->
        <section class="pagina tela-local">
            <div class="card-imagem">
                <img src="imagens/local.png" alt="Localização" class="imagem-tela">
                <button class="botao-mapa" onclick="abrirMapa()" aria-label="Como chegar"></button>
                <div class="deslize">Deslize para baixo ↓</div>
            </div>
        </section>

        <!-- TELA 4 - CONTAGEM REGRESSIVA -->
        <section class="pagina tela-contagem">
            <div class="card-imagem">
                <img src="imagens/contagem.png" alt="Contagem Regressiva" class="imagem-tela">
                <div class="contador-sobreposto">
                    <div class="tempo">
                        <strong id="dias">00</strong>
                        <span>DIAS</span>
                    </div>
                    <div class="tempo">
                        <strong id="horas">00</strong>
                        <span>HORAS</span>
                    </div>
                    <div class="tempo">
                        <strong id="minutos">00</strong>
                        <span>MIN</span>
                    </div>
                    <div class="tempo">
                        <strong id="segundos">00</strong>
                        <span>SEG</span>
                    </div>
                </div>
                <div class="deslize">Deslize para baixo ↓</div>
            </div>
        </section>

        <!-- TELA 5 - MENSAGEM ESPECIAL -->
        <section class="pagina tela-mensagem">
            <div class="card-imagem">
                <img src="imagens/mensagem.png" alt="Mensagem Especial" class="imagem-tela">
                <div class="deslize">Deslize para baixo ↓</div>
            </div>
        </section>
<!-- TELA - LISTA DE PRESENTES E PIX -->
        <section class="pagina tela-presentes">
            <div class="card-imagem">
                <img src="imagens/presentes.png" alt="Lista de Presentes" class="imagem-tela">
                
                <!-- Botões invisíveis sobrepostos nas Lojas -->
                <button class="btn-overlay btn-loja-1" onclick="abrirLoja('https://maps.app.goo.gl/qjCq8rKjcjvz8WJ27')" aria-label="Loja 1"></button>
                <button class="btn-overlay btn-loja-2" onclick="abrirLoja('https://maps.app.goo.gl/qjCq8rKjcjvz8WJ27')" aria-label="Loja 2"></button>
                <button class="btn-overlay btn-loja-3" onclick="abrirLoja('https://maps.app.goo.gl/qjCq8rKjcjvz8WJ27')" aria-label="Loja 3"></button>

                <!-- Botões invisíveis sobrepostos no PIX -->
                <button class="btn-overlay btn-pix-50" onclick="abrirPix(50)" aria-label="PIX 50 reais"></button>
                <button class="btn-overlay btn-pix-100" onclick="abrirPix(100)" aria-label="PIX 100 reais"></button>
                <button class="btn-overlay btn-pix-150" onclick="abrirPix(150)" aria-label="PIX 150 reais"></button>
                <button class="btn-overlay btn-pix-200" onclick="abrirPix(200)" aria-label="PIX 200 reais"></button>

                <div class="deslize">Deslize para baixo ↓</div>
            </div>
        </section>

        <!-- TELA - CONFIRMAÇÃO DE PRESENÇA -->
        <section class="pagina tela-rsvp">
            <div class="card-imagem">
                <img src="imagens/presenca.png" alt="Confirmar Presença" class="imagem-tela">
                
                <!-- Botão invisível sobreposto ao botão do WhatsApp -->
                <button class="btn-overlay btn-wsp-imagem" onclick="confirmarPresenca()" aria-label="Confirmar presença no WhatsApp"></button>
                
                <div class="deslize">Deslize para baixo ↓</div>
            </div>
        </section>
        <!-- TELA 6 - FINAL -->
        <section class="pagina tela-final">
            <div class="card-imagem">
                <img src="imagens/final.png" alt="Mensagem Final" class="imagem-tela">
                <button class="botao-inicio" onclick="voltarInicio()" aria-label="Voltar ao início"></button>
            </div>
        </section>

    </main>

    <script src="scripts/script.js"></script>
</body>

</html>
